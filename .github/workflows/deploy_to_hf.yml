name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          # Clone the HF Space repo
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/AlinaSydoruk/asteroid-hazard-predictor hf_space

          # Copy only what the Space needs
          cp requirements.txt hf_space/
          cp -r src hf_space/
          
           # Generate a clean UTF-8 README.md directly on the runner
          cat > hf_space/README.md << 'EOF'
          ---
          title: Asteroid Hazard Predictor
          emoji: ☄️
          colorFrom: indigo
          colorTo: purple
          sdk: gradio
          sdk_version: 5.9.1
          app_file: src/ui/app.py
          python_version: "3.11"
          pinned: false
          ---

          # Asteroid Hazard Predictor
          Predicts whether near-Earth asteroids are potentially hazardous.
          EOF

          # Commit and push
          cd hf_space
          git add .
          git diff --cached --quiet || (git commit -m "Sync from GitHub main" && git push)
          
          
          
          
